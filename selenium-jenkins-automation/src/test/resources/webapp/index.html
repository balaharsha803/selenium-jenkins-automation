<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo QA Portal</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#172033}
    header{background:#1f3a5f;color:white;padding:18px 8%;display:flex;gap:24px;align-items:center}
    header a{color:white;text-decoration:none;cursor:pointer}
    main{max-width:760px;margin:32px auto;background:white;padding:28px;border-radius:12px;box-shadow:0 4px 18px #0001}
    input,textarea,button{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;font-size:16px}
    button{background:#1f3a5f;color:white;border:0;border-radius:6px;cursor:pointer}
    .message{padding:10px;margin-top:12px;border-radius:6px}
    .error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<header>
  <strong>Demo QA Portal</strong>
  <a href="#home" data-testid="nav-home">Home</a>
  <a href="#about" data-testid="nav-about">About</a>
  <a href="#feedback" data-testid="nav-feedback">Feedback</a>
</header>
<main>
  <section id="home">
    <h1 data-testid="home-heading">Welcome to the Demo QA Portal</h1>
    <p>This local application is provided for Selenium regression testing.</p>
    <form id="login-form">
      <h2>Login</h2>
      <label for="username">Username</label>
      <input id="username" data-testid="username" required autocomplete="off">
      <label for="password">Password</label>
      <input id="password" data-testid="password" type="password" required>
      <button type="submit" data-testid="login-button">Login</button>
      <p id="login-message" class="message" role="status" hidden></p>
    </form>
    <section id="dashboard" data-testid="dashboard" hidden>
      <h2>Dashboard</h2>
      <p data-testid="welcome-message">You are successfully logged in.</p>
    </section>
  </section>
  <section id="about" hidden>
    <h2 data-testid="about-heading">About this application</h2>
    <p>A simple sample site for automated software testing.</p>
  </section>
  <section id="feedback" hidden>
    <h2>Feedback form</h2>
    <form id="feedback-form">
      <label for="feedback-name">Name</label>
      <input id="feedback-name" data-testid="feedback-name" required>
      <label for="feedback-email">Email</label>
      <input id="feedback-email" data-testid="feedback-email" type="email" required>
      <label for="feedback-message">Message</label>
      <textarea id="feedback-message" data-testid="feedback-message" required></textarea>
      <button type="submit" data-testid="feedback-submit">Submit feedback</button>
      <p id="feedback-result" class="message" role="status" hidden></p>
    </form>
  </section>
</main>
<script>
  const sections = [...document.querySelectorAll('main > section')];
  function showSection(id) {
    sections.forEach(section => section.hidden = section.id !== id);
    if (!sections.some(section => section.id === id)) {
      sections.forEach(section => section.hidden = section.id !== 'home');
    }
  }
  document.querySelectorAll('header a').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      const id = link.getAttribute('href').slice(1);
      showSection(id);
      history.replaceState(null, '', '#' + id);
    });
  });
  document.getElementById('login-form').addEventListener('submit', event => {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('login-message');
    msg.hidden = false;
    if (username === 'demo' && password === 'Password123!') {
      msg.className = 'message success';
      msg.textContent = 'Login successful';
      document.getElementById('dashboard').hidden = false;
    } else {
      msg.className = 'message error';
      msg.textContent = 'Invalid username or password';
      document.getElementById('dashboard').hidden = true;
    }
  });
  document.getElementById('feedback-form').addEventListener('submit', event => {
    event.preventDefault();
    const result = document.getElementById('feedback-result');
    result.hidden = false;
    result.className = 'message success';
    result.textContent = 'Feedback submitted successfully';
  });
  showSection(location.hash.slice(1) || 'home');
</script>
</body>
</html>
